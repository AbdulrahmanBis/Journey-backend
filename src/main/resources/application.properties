spring.application.name=Journey

server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/journey_db
spring.datasource.username=root
spring.datasource.password=12345

# ─── Migrations ───────────────────────────────────────────────────────────────
# A database that already has tables but no Flyway history (created before Flyway) is recorded as being at
# version 1, the baseline, and only later versions run on it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that the entities match it,
# so a missing migration fails at startup instead of Hibernate quietly altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=journey-super-secret-key-change-in-production-must-be-256-bits-long
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200,http://localhost:3001,https://digination-journey.online,http://digination-journey.online

logging.level.com.journey=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ─── File storage & uploads ───────────────────────────────────────────────────
# Bytes live on disk (or, later, on the real file server); the database only ever
# stores the opaque storage key. Swap LocalDiskStorageService for another
# StorageService implementation to move where the bytes go.
app.storage.local.root=./storage
app.storage.max-file-size-bytes=209715200

# Multipart limits must be at least as large as the storage limit above, or
# Spring rejects the request before our own error message can be returned.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ── Notifications ────────────────────────────────────────────────────────────
# Templates live on disk, not in the jar, so wording can be fixed without a rebuild.
# Edits are picked up automatically on the next notification.
app.notifications.templates-root=./notifications/templates
# Used by email templates to turn an in-app route into an absolute link.
app.frontend-url=http://localhost:4200

# Language used for email when the recipient has not picked one in the UI.
app.notifications.default-language=en

# ── Notification email ───────────────────────────────────────────────────────
# Off by default so a developer running locally cannot email real colleagues.
# Turn on AND set app.mail.host to start sending. Admins can check the setup with "Send test email" on the
# notifications page. No host means no mail server at all (see MailConfig).
app.notifications.mail.enabled=false
app.notifications.mail.from=journey@diginationmea.com
# Office 365: smtp.office365.com, 587, STARTTLS, the mailbox address and its password (or an app password).
app.mail.host=
app.mail.port=587
app.mail.username=
app.mail.password=
app.mail.starttls=true

# ── Due-date reminders ───────────────────────────────────────────────────────
# Hourly by default (and once at startup); each reminder is sent once per due date.
app.reminders.enabled=true
app.reminders.cron=0 0 * * * *

# ── First admin ─────────────────────────────────────────────────────────────
# On an empty database nobody could sign in. When no Admin exists and both values are set, one is created at
# startup (with an "Administration" department if there is none). Change the password after the first sign-in.
app.bootstrap.admin.email=
app.bootstrap.admin.password=
app.bootstrap.admin.name=Administrator
