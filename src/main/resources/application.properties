spring.application.name=Journey

server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/journey_db
spring.datasource.username=root
spring.datasource.password=12345

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=journey-super-secret-key-change-in-production-must-be-256-bits-long
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200,http://localhost:3001

logging.level.com.journey=DEBUG
logging.level.org.hibernate.SQL=DEBUG
