spring.application.name=Journey

server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/journey_db
spring.datasource.username=root
spring.datasource.password=12345

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=journey-super-secret-key-change-in-production-must-be-256-bits-long
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200,http://localhost:3001,https://digination-journey.online,http://digination-journey.online

logging.level.com.journey=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ─── File storage & uploads ───────────────────────────────────────────────────
# Bytes live on disk (or, later, on the real file server); the database only ever
# stores the opaque storage key. Swap LocalDiskStorageService for another
# StorageService implementation to move where the bytes go.
app.storage.local.root=./storage
app.storage.max-file-size-bytes=209715200

# Multipart limits must be at least as large as the storage limit above, or
# Spring rejects the request before our own error message can be returned.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
